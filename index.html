<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>BACO STUDIO · Masterplan Hotel La Fontana (Piso 2)</title>
    <meta name="title" content="BACO STUDIO · Masterplan Hotel La Fontana (Piso 2)" />
    <meta name="description" content="Gemelo digital y masterplan 3D interactivo desarrollado por BACO STUDIO para la remodelación del Hotel Estelar La Fontana (Piso 2)." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS for 'Dónde estamos' OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="./src/styles/masterplan.css" />

    <!-- Import Map for ES Modules (Three.js & GSAP) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="app">
      <!-- 3D WebGL Canvas Container -->
      <div id="canvas-container"></div>


      <!-- Top Right Controls (Centrum style + BIM Agent toggle) -->
      <div class="top-right-bar">
        <div class="mode-switch-group">
          <button class="mode-pill-btn active" data-mode="exterior" title="Vista exterior Hotel La Fontana con entorno urbano Catastro">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M11 21v-3h2v3"/></svg> Exterior 3D
          </button>
          <button class="mode-pill-btn" data-mode="interior" title="Corte 3D Piso 2 con texturas y mobiliario real">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/></svg> Corte Piso 2 Real
          </button>
          <button class="mode-pill-btn" data-mode="top" title="Planta 3D ortogonal">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V3l18 18z"/><path d="M7 17v-4l4 4z"/></svg> Planta 3D
          </button>
        </div>

        <button class="mode-pill-btn" id="btn-toggle-bim-agent" style="background: rgba(37,211,102,0.22); border: 1px solid rgba(37,211,102,0.5); color: #72f79f;" title="Activar/Desactivar Revit AI Agent & BIM Inspector">
          <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> Agente BIM
        </button>

        <a class="contact-pill-btn" href="https://wa.me/573000000000?text=Hola,%20quisiera%20informaci%C3%B3n%20sobre%20el%20Hotel%20La%20Fontana" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Contáctanos
        </a>
      </div>

      <!-- Left Sidebar (Inmuebles / Habitaciones Filters) -->
      <div class="left-sidebar-wrapper" id="left-sidebar-wrapper"></div>

      <!-- Center Floating Detail Card -->
      <div id="room-detail-container"></div>

      <!-- Bottom Dock Navigation -->
      <!-- Sky Atmosphere: hora del día (cielo procedural tipo Unreal) -->
      <div class="sky-time-control" title="Hora del día · Sol, atmósfera y nubes procedurales">
        <span class="sky-time-icon"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <input type="range" id="sky-hour" min="5.8" max="18.2" step="0.05" value="10.5" />
        <span class="sky-time-label" id="sky-hour-label">10:30</span>
      </div>

      <div id="bottom-dock-container"></div>

      <!-- WhatsApp Floating Pill -->
      <a class="whatsapp-float-btn" href="https://wa.me/573000000000?text=Hola,%20estoy%20viendo%20el%20masterplan%20del%20Hotel%20La%20Fontana" target="_blank" rel="noopener" title="Contactar por WhatsApp">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.031 2C6.511 2 2.016 6.495 2.016 12.015c0 1.879.52 3.654 1.424 5.184L2 22l4.957-1.408c1.477.838 3.178 1.423 5.074 1.423 5.521 0 10.016-4.495 10.016-10.015C22.047 6.495 17.552 2 12.031 2zm5.82 14.28c-.244.686-1.425 1.319-1.973 1.378-.507.054-1.155.079-3.376-.842-2.378-.985-3.904-3.411-4.023-3.57-.118-.158-.962-1.277-.962-2.436 0-1.158.608-1.728.825-1.966.216-.237.472-.296.63-.296.157 0 .315.002.453.008.147.007.345-.056.541.414.204.488.697 1.704.757 1.826.06.122.1.265.02.423-.08.158-.119.256-.237.394-.118.138-.249.308-.356.414-.118.118-.241.246-.104.482.138.236.611 1.008 1.31 1.63 1.026.914 1.892 1.197 2.128 1.315.236.118.374.098.512-.059.138-.157.591-.689.749-.925.158-.236.315-.197.531-.118.217.079 1.379.65 1.616.768.237.118.394.177.453.276.06.098.06.571-.184 1.257z"/>
        </svg>
      </a>
    </div>

    <!-- Main Module Script -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
